<!DOCTYPE html>

<head>
    <title>Inline Formatting</title>
</head>
<body>
    <p>
        I am a <strong>computer science student</strong> who enjoys
        <em>learning new technologies</em> and
        <mark>building projects</mark>.<br>
        <small>Learning something new every day helps me improve.</small>
    </p>
</body>
</html>
