<!DOCTYPE html>
<html>
<head>
    <title>Box Model</title>
    <link rel="stylesheet" href="Q8.css">
</head>
<body>

    <main>
        <section class="box-area">
            <div class="margin">
                <div class="border">
                    <div class="padding">
                        <div class="content">
                            Content
                        </div>
                    </div>
                </div>
            </div>

            <p>Content: actual text or element area.</p>
            <p>Padding: space inside the border.</p>
            <p>Border: line around the padding.</p>
            <p>Margin: space outside the border.</p>
        </section>

        <section class="size-box">
            <h2>Box Sizing</h2>
            <p>This box uses border-box.</p>
        </section>
    </main>

</body>
</html>
