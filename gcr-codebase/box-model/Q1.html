<!DOCTYPE html>
<html>
<head>
    <title>Borders and Padding</title>
    <link rel="stylesheet" href="Q1.css">
</head>
<body>

    <header>
        <h1>Borders and Padding</h1>
    </header>

    <main>
        <section class="box solid">
            <h2>Solid Border</h2>
            <p>Normal solid border.</p>
        </section>

        <section class="box dashed">
            <h2>Dashed Border</h2>
            <p>Dashed border example.</p>
        </section>

        <section class="box double">
            <h2>Double Border</h2>
            <p>Double border example.</p>
        </section>

        <section class="box groove">
            <h2>Groove Border</h2>
            <p>Groove border example.</p>
        </section>

        <section class="box rounded">
            <h2>Rounded</h2>
            <p>Rounded corners example.</p>
        </section>
    </main>

</body>
</html>
