<!DOCTYPE html>
<html>
<head>
    <title>Height and Width</title>
    <link rel="stylesheet" href="Q2.css">
</head>
<body>

    <header>
        <h1>Height and Width Practice</h1>
    </header>

    <main>
        <section class="box box1">
            <h2>Fixed Size</h2>
            <p>This box uses pixels for height and width.</p>
        </section>

        <section class="box box2">
            <h2>Percentage Size</h2>
            <p>This box uses percentage width.</p>
        </section>

        <section class="box box3">
            <h2>Viewport Size</h2>
            <p>This box uses vh and em units.</p>
            <p>This is some extra text to demonstrate overflow inside the box.</p>
        </section>
    </main>

</body>
</html>
