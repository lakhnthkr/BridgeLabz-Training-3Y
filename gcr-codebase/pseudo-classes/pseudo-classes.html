<!DOCTYPE html>
<html>
<head>
    <title>Pseudo Classes</title>
    <link rel="stylesheet" href="Q1.css">
</head>
<body>

    <h1>Pseudo-Class Examples</h1>

    <main>
        <section>
            <a href="#">Hover over this link</a>
            <p>:hover changes the link when the mouse is over it.</p>
        </section>

        <section>
            <input type="text" placeholder="Click here">
            <p>:focus changes the input when it is selected.</p>
        </section>

        <section>
            <button>Click Me</button>
            <p>:active changes the button while clicking.</p>
        </section>

        <section>
            <ul>
                <li>First Item</li>
                <li>Second Item</li>
                <li>Third Item</li>
            </ul>
            <p>:nth-child() selects an item based on its position.</p>
        </section>
    </main>

</body>
</html>
