<!DOCTYPE html>
<html>
<head>
    <title>Image Showcase</title>
    <link rel="stylesheet" href="Q3.css">
</head>
<body>

    <h1>Image Showcase</h1>

    <main class="gallery">

        <figure>
            <div class="image-box">
                <img src="https://i0.wp.com/picjumbo.com/wp-content/uploads/beautiful-fall-nature-scenery-free-image.jpeg?w=600&quality=80" alt="Nature">
            </div>
            <figcaption>Nature</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcST7nscPz5hohgk7lhi_5Sj_FODa-zvu33HdTRNrAkb0f-wdDj89aq-X5pD&s=10" alt="Mountain">
            </div>
            <figcaption>Mountain</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://images.pexels.com/photos/36694789/pexels-photo-36694789/free-photo-of-solitude-on-the-pristine-beach-of-kas-turkiye.jpeg?cs=tinysrgb&dpr=1&w=500" alt="Beach">
            </div>
            <figcaption>Beach</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTzfuRZwWDXEVLOhZ6b6koIkizgMndNeft4b84tqdNNsw&s=10" alt="City">

        </figure>

        <figure>

            </div>
            <figcaption>Forest</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://www.cmycubes.com/cdn/shop/articles/sebastien-gabriel--imlv9jlb24-unsplash-1_2cd354bd-fe04-4a11-b301-5b002e1e9f61.jpg?v=1780874958&width=1100" alt="Sunset">
            </div>
            <figcaption>Sunset</figcaption>
        </figure>

    </main>

</body>
</html>
