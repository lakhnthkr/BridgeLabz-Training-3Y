<!DOCTYPE html>
<html>
<head>
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="Q10.css">
</head>
<body>

    <header>
        <h1>My Mini UI</h1>
    </header>

    <main>
        <section class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQviDwAhQziIC7799R1Ll4STmKmtAbEIGh0mXheu8m7Ng&s=10" alt="Sample Image">

            <h2>Contact Me</h2>

            <form>
                <input type="text" placeholder="Your Name">
                <input type="email" placeholder="Your Email">
                <textarea placeholder="Your Message"></textarea>

                <div>
                    <button type="submit">Submit</button>
                    <button type="reset">Clear</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
