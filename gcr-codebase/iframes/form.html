<!DOCTYPE html>
<html>
<head>
    <title>Form with iframe</title>
</head>
<body>

    <h2>Student Form</h2>

    <!-- The submitted form page will open inside this iframe -->
    <iframe name="resultFrame" width="500" height="200" title="Form result">
    </iframe>

    <br><br>

    <form action="result.html" method="get" target="resultFrame">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
