<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Form</title>
</head>
<body>

    <h1>Login</h1>

    <!-- This form is used to enter login details. -->
    <form>

        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <!-- CSRF token helps protect the form from unwanted requests. -->
        <input type="hidden" name="csrf_token" value="dummy123">

        <input type="submit" value="Login">

    </form>

</body>
</html>
