<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My City Map</title>
</head>
<body>

    <h1>Map of Agra</h1>

    <!-- This iframe is used to show the location on Google Maps. -->
    <!-- loading="lazy" helps the map load only when it is needed. -->
    <iframe
        src="https://www.google.com/maps?q=Agra%2C%20India&output=embed"
        title="Map showing Agra"
        width="600"
        height="450"
        loading="lazy">
    </iframe>

</body>
</html>
