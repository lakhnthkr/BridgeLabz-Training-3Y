<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URI Encoding</title>
</head>
<body>

    <h1>URI Encoding</h1>

    <!-- This link contains special characters in the URL. -->
    <p>
        Original URL:
        https://example.com/search?query=HTML & CSS
    </p>

    <!-- Spaces are written as %20 in the encoded URL. -->
    <p>
        Encoded URL:
        <a href="https://example.com/search?query=HTML%20%26%20CSS">
            https://example.com/search?query=HTML%20%26%20CSS
        </a>
    </p>

</body>
</html>
