<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Upload</title>
</head>
<body>

    <h1>Upload Your File</h1>

    <!-- This form is used to upload an image file. -->
    <form>

        <label for="myfile">Choose a file:</label>
        <input type="file" id="myfile" name="myfile" accept=".jpg, .png">
        <br><br>

        <p>Only JPG and PNG image files are allowed.</p>

        <input type="submit" value="Upload">

    </form>

</body>
</html>
