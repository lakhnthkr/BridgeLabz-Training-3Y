<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="Q6.css">
</head>
<body>

    <h1>My Image Gallery</h1>

    <div class="gallery">

        <div class="image">
            <img src="image1.jpg" alt="Nature Image">
            <p>Nature</p>
        </div>

        <div class="image">
            <img src="image2.jpg" alt="Mountain Image">
            <p>Mountains</p>
        </div>

        <div class="image">
            <img src="image3.jpg" alt="River Image">
            <p>River</p>
        </div>

        <div class="image">
            <img src="image4.jpg" alt="Forest Image">
            <p>Forest</p>
        </div>

        <div class="image">
            <img src="image5.jpg" alt="Beach Image">
            <p>Beach</p>
        </div>

        <div class="image">
            <img src="image6.jpg" alt="Sunset Image">
            <p>Sunset</p>
        </div>

    </div>

</body>
</html>
