<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="Q5.css">
</head>
<body>

    <h1>Choose Your Plan</h1>

    <div class="plans">

        <div class="plan">
            <h2>Basic</h2>
            <p class="price">₹199</p>
            <p>Simple features for beginners.</p>
            <p>1 User</p>
            <p>5 GB Storage</p>
            <a href="#">Choose Plan</a>
        </div>

        <div class="plan popular">
            <h2>Standard</h2>
            <p class="price">₹499</p>
            <p>Useful features for regular users.</p>
            <p>5 Users</p>
            <p>20 GB Storage</p>
            <a href="#">Choose Plan</a>
        </div>

        <div class="plan">
            <h2>Premium</h2>
            <p class="price">₹999</p>
            <p>Advanced features for professionals.</p>
            <p>10 Users</p>
            <p>50 GB Storage</p>
            <a href="#">Choose Plan</a>
        </div>

    </div>

</body>
</html>
