<!DOCTYPE html>
<html>
<head>
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="Q5.css">
</head>
<body>

    <h1>Pricing Plans</h1>

    <main class="plans">

        <div class="card">
            <h2>Basic</h2>
            <h3>₹199</h3>
            <p>1 User</p>
            <p>5 GB Storage</p>
            <p>Basic Support</p>
        </div>

        <div class="card popular">
            <h2>Standard</h2>
            <h3>₹499</h3>
            <p>5 Users</p>
            <p>20 GB Storage</p>
            <p>Priority Support</p>
        </div>

        <div class="card">
            <h2>Premium</h2>
            <h3>₹999</h3>
            <p>10 Users</p>
            <p>50 GB Storage</p>
            <p>Premium Support</p>
        </div>

    </main>

</body>
</html>
