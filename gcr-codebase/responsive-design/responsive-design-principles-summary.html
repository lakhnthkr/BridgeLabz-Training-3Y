<!DOCTYPE html>
<html>
<head>
    <title>Responsive Design Principles</title>
    <link rel="stylesheet" href="responsive-design-principles-summary.css">
</head>
<body>

    <h1>Responsive Design Principles</h1>

    <main>
        <section>
            <h2>Fluid Layouts</h2>
            <p>Layouts adjust according to available screen space.</p>
            <code>width: 100%;</code>
        </section>

        <section>
            <h2>Flexible Media</h2>
            <p>Images and media should adjust to the screen.</p>
            <code>max-width: 100%;</code>
        </section>

        <section>
            <h2>Breakpoints</h2>
            <p>Breakpoints change styles at different screen sizes.</p>
            <code>@media screen</code>
        </section>
    </main>

</body>
</html>
