<!DOCTYPE html>
<html>
<head>
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>

    <header>
        <h1>Responsive Image Filter Gallery</h1>
    </header>

    <main class="gallery">

        <figure>
            <img class="blur"
                 src="https://picsum.photos/400/300?random=1"
                 alt="Nature">
            <figcaption>Blur</figcaption>
        </figure>

        <figure>
            <img class="grayscale"
                 src="https://picsum.photos/400/300?random=2"
                 alt="Mountain">
            <figcaption>Grayscale</figcaption>
        </figure>

        <figure>
            <img class="sepia"
                 src="https://picsum.photos/400/300?random=3"
                 alt="Beach">
            <figcaption>Sepia</figcaption>
        </figure>

        <figure>
            <img class="brightness"
                 src="https://picsum.photos/400/300?random=4"
                 alt="City">
            <figcaption>Brightness</figcaption>
        </figure>

        <figure>
            <img class="contrast"
                 src="https://picsum.photos/400/300?random=5"
                 alt="Forest">
            <figcaption>Contrast</figcaption>
        </figure>

        <figure>
            <img class="hue"
                 src="https://picsum.photos/400/300?random=6"
                 alt="Sunset">
            <figcaption>Hue Rotate</figcaption>
        </figure>

    </main>

    <footer>
        <p>© 2026 Image Gallery</p>
    </footer>

</body>
</html>
