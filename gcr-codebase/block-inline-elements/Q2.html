<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Product Catalog</title>
</head>

<body>

    <h1>Online Product Catalog</h1>

    <!-- Product Catalog Table -->
<table border="1">
    <tr>
        <th>Product Name</th>
        <th>Description</th>
        <th>Price</th>
        <th>Availability</th>
    </tr>

        <tr>
            <th>Image</th>
            <th>Product Name and Description</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>

        <tr>
            <td>
                <img src="https://via.placeholder.com/100" alt="Laptop Image">
            </td>
            <td>
                <strong>Laptop</strong><br>
                High-performance laptop for students.
            </td>
            <td>₹50,000</td>
            <td>Available</td>
        </tr>

        <tr>
            <td>
                <img src="https://via.placeholder.com/100" alt="Phone Image">
            </td>
            <td>
                <strong>Smartphone</strong><br>
                Modern smartphone with good camera.
            </td>
            <td>₹25,000</td>
            <td rowspan="2">Available</td>
        </tr>

        <tr>
            <td>
                <img src="https://via.placeholder.com/100" alt="Headphones Image">
            </td>
            <td>
                <strong>Headphones</strong><br>
                Wireless headphones.
            </td>
            <td>₹2,000</td>
        </tr>
    </table>

</body>

</html>
