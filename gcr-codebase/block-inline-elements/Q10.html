<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Travel Selection</title>
</head>

<body>

    <h1>Travel Selection Page</h1>

    <label for="country">Country:</label>
    <select id="country">
        <option>India</option>
        <option>USA</option>
        <option>Japan</option>
    </select>

    <br><br>

    <label for="state">State:</label>
    <select id="state">
        <option>Uttar Pradesh</option>
        <option>Delhi</option>
        <option>Rajasthan</option>
    </select>

    <br><br>

    <label for="city">City:</label>
    <select id="city">
        <option>Mathura</option>
        <option>Delhi</option>
        <option>Agra</option>
    </select>

    <br><br>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
        <option>Taj Mahal</option>
        <option>Goa Beach</option>
        <option>Red Fort</option>
        <!-- <option selected>India</option> -->
    </select>

    <p>
        I selected India as my country, Uttar Pradesh as my state,
        Mathura as my city, and Taj Mahal as my favorite tourist place.
    </p>

</body>

</html>
